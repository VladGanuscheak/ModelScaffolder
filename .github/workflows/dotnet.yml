name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  PROJECTS: >-
    ModelScaffolder.Cli/ModelScaffolder.Cli.csproj
    ModelScaffolder.Core.Tests/ModelScaffolder.Core.Tests.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Clean
      run: for project in $PROJECTS; do dotnet clean "$project" -c $CONFIGURATION; done

    - name: Restore dependencies
      run: for project in $PROJECTS; do dotnet restore "$project"; done

    - name: Build
      run: for project in $PROJECTS; do dotnet build "$project" -c $CONFIGURATION --no-restore; done

    - name: Test
      run: >-
        dotnet test ModelScaffolder.Core.Tests/ModelScaffolder.Core.Tests.csproj
        -c $CONFIGURATION --no-build --verbosity normal
        --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults
